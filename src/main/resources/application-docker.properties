# Used by docker-compose (SPRING_PROFILES_ACTIVE=docker). Everything comes from environment variables.
spring.application.name=cv_scanner

spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/cv_scanner_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secretKey=${JWT_SECRET_KEY}
# Milliseconds
jwt.accessTokenExpirationTime=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
# Minutes
jwt.refreshTokenExpirationTime=${JWT_REFRESH_TOKEN_EXPIRATION:3600}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

minio.url=${MINIO_URL:http://minio:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET:cv-scanner-data}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:200MB}

# Batch tuning
app.batch.max-concurrent-jobs=${BATCH_MAX_CONCURRENT_JOBS:2}
app.batch.retry.max-attempts=${BATCH_RETRY_MAX_ATTEMPTS:3}
app.batch.retry.delay=${BATCH_RETRY_DELAY:500ms}

# Email notification after a batch finishes
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.notification.enabled=${NOTIFICATION_ENABLED:true}
app.notification.from=${NOTIFICATION_FROM:noreply@cvscanner.local}
app.notification.hr-email=${NOTIFICATION_HR_EMAIL:}

springdoc.swagger-ui.path=/swagger-ui.html
